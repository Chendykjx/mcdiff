name: snapshot

on:
  schedule:
    # 09:30 / 14:10 / 19:30 Asia/Shanghai (GitHub cron is UTC)
    - cron: "30 1 * * *"
    - cron: "10 6 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "逗号分隔的门店编号（留空则用仓库变量 MCD_STORES）"
        required: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture menu snapshots
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          STORES: ${{ inputs.stores || vars.MCD_STORES }}
          CITY: ${{ vars.MCD_CITY }}
          KEYWORD: ${{ vars.MCD_KEYWORD }}
          TZ: Asia/Shanghai
        run: |
          STORES="${STORES:-1420576}"
          CITY="${CITY:-深圳市}"
          KEYWORD="${KEYWORD:-麦当劳}"
          python scripts/collect.py --stores "$STORES" --city "$CITY" --keyword "$KEYWORD"

      - name: Commit snapshot
        run: |
          git config user.name "mcdiff-bot"
          git config user.email "mcdiff@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no menu change today"
          else
            git commit -m "chore(snapshot): menu diff @ $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
